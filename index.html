<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>消耗品購入リスト</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --text:#1f2430; --muted:#6b7280; --line:#e3e6ec;
  --accent:#2563eb; --accent-text:#fff; --warn:#c2410c; --warn-bg:#fff1e6; --good:#15803d; --good-bg:#e8f6ec;
  --head:#f0f2f6; --shadow:0 1px 3px rgba(0,0,0,.08);
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --surface:#1d2027; --text:#e8eaf0; --muted:#9aa3b2; --line:#2e333d;
    --accent:#5b8cff; --accent-text:#0b1020; --warn:#ffa56b; --warn-bg:#3a2616; --good:#6fd18c; --good-bg:#16301f;
    --head:#252932; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --text:#e8eaf0; --muted:#9aa3b2; --line:#2e333d;
  --accent:#5b8cff; --accent-text:#0b1020; --warn:#ffa56b; --warn-bg:#3a2616; --good:#6fd18c; --good-bg:#16301f;
  --head:#252932; --shadow:none; color-scheme:dark;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px var(--gutter-r) 10px var(--gutter-l);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
h1{font-size:17px;margin:0}
.tabs{display:flex;gap:4px;flex:1}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-text);font-weight:600}
.tools{display:flex;gap:6px}
main{padding:16px var(--gutter-r) 16px var(--gutter-l);max-width:1500px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.sm{padding:2px 8px;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.bar .spacer{flex:1}
select,input,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--head);font-weight:600;font-size:12px;color:var(--muted);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td.r,th.r{text-align:right}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tr.group td{background:var(--head);font-weight:600;color:var(--muted);font-size:12px}
td input.num{width:78px;text-align:right}
td input.qty{width:58px;text-align:right}
td.name{font-weight:600}
td.sticky,th.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
th.sticky{background:var(--head);z-index:2}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;margin-left:6px;background:var(--head);color:var(--muted)}
.tag.due{background:var(--warn-bg);color:var(--warn)}
.pricey{color:var(--warn);border-color:var(--warn)}
.good{color:var(--good);font-weight:600}
.warn{color:var(--warn);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.summary{padding:10px 14px;display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line)}
.summary b{font-size:16px}
.stats-grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.stats-grid{grid-template-columns:1fr}}
.pie-wrap{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pie-wrap svg{width:100%;max-width:240px;height:auto}
.legend{width:100%;display:grid;gap:4px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span.v{margin-left:auto;font-variant-numeric:tabular-nums}
.period{display:flex;gap:4px}
.period button{padding:5px 14px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.period button:first-child{border-radius:8px 0 0 8px}.period button:last-child{border-radius:0 8px 8px 0}
.period button[aria-pressed=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.range-label{font-weight:700;font-size:16px;min-width:11em;text-align:center}
.total-big{font-size:22px;font-weight:700}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(560px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .dlg{padding:18px}
dialog h2{margin:0 0 12px;font-size:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form-grid input,.form-grid select{width:100%;color:var(--text);font-size:14px}
.combo{position:relative;display:block}
.combo input{padding-right:30px}
.combo-btn{position:absolute;right:1px;top:1px;bottom:1px;width:28px;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);border-radius:0 5px 5px 0;cursor:pointer;font-size:12px;padding:0}
.combo-btn:hover{color:var(--text);background:var(--head)}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:60;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:210px;overflow-y:auto}
.combo-list li{padding:6px 8px;border-radius:5px;cursor:pointer;color:var(--text);font-size:14px}
.combo-list li:hover,.combo-list li.on{background:var(--accent);color:var(--accent-text)}
.combo-list li.empty{cursor:default;color:var(--muted);background:none}
td.name .linkish{cursor:pointer;border-bottom:1px dashed var(--muted)}
.form-grid .inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.form-grid .inline input{width:auto}
.cycle-row{display:flex;gap:6px;align-items:center}
.cycle-row input{width:70px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.hint.good{color:var(--good)}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:700px){.totals{grid-template-columns:1fr}}
.totals section{padding:10px 14px;min-width:0}
.totals h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.totals ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.totals li{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:8px;align-items:center}
.totals li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.totals li .bar-t{height:8px;border-radius:4px;background:var(--head);overflow:hidden}
.totals li .bar-t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.totals li .v{font-variant-numeric:tabular-nums;font-weight:600}
.totals .none{color:var(--muted)}
.cmp-item{margin-bottom:12px;overflow:hidden}
.cmp-item h3{margin:0;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line)}
.cmp-item h3 small{font-weight:400;color:var(--muted)}
tr.best td{background:var(--good-bg)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;margin-left:6px;background:var(--good);color:var(--bg)}
.sale{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:0 6px;margin-left:4px;background:var(--warn-bg);color:var(--warn);vertical-align:middle}
.sync{font-size:12px;color:var(--muted)}
.sync.bad{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:50;max-width:90vw}
.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<header class="top">
  <h1>消耗品購入リスト</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="list">購入リスト</button>
    <button role="tab" data-tab="items">品目リスト</button>
    <button role="tab" data-tab="compare">価格比較</button>
    <button role="tab" data-tab="stats">集計</button>
  </nav>
  <div class="tools"><span class="sync" id="sync"></span>
    <button class="btn sm" id="exportBtn" title="データをJSONファイルで保存">書き出し</button>
    <label class="btn sm" title="書き出したJSONを読み込み">読み込み<input type="file" id="importFile" accept="application/json,.json" hidden></label>
  </div>
</header>
<main id="app"></main>

<dialog id="confirmDlg"><div class="dlg"><p id="confirmMsg" style="margin:0 0 4px"></p>
  <div class="actions"><button class="btn" id="confirmNo">キャンセル</button><button class="btn primary" id="confirmYes">OK</button></div></div></dialog>
<div class="toast" id="toast" hidden></div>

<!-- 品目 追加/編集 -->
<dialog id="itemDlg">
  <form id="itemForm" method="dialog">
    <h2 id="itemDlgTitle">品目</h2>
    <div class="form-grid">
      <label class="full">品名<input name="name" required maxlength="60" placeholder="例：トイレットペーパー"></label>
      <label>カテゴリ<span class="combo" data-combo="category"><input name="category" maxlength="30" placeholder="例：日用品" autocomplete="off"><button type="button" class="combo-btn" tabindex="-1" aria-label="過去の入力から選ぶ">▼</button></span></label>
      <label>購入場所（業態・店舗名）<span class="combo" data-combo="place"><input name="place" maxlength="40" placeholder="例：スーパー / ファミリーマート" autocomplete="off"><button type="button" class="combo-btn" tabindex="-1" aria-label="過去の入力から選ぶ">▼</button></span></label>
      <label>単価（円）<input name="unitPrice" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>数量<input name="qty" type="number" min="0" step="any" inputmode="decimal" value="1"></label>
      <label class="full">購入サイクル
        <span class="cycle-row">
          <select name="cycleUnit">
            <option value="none">なし（手動で追加）</option>
            <option value="day">日</option>
            <option value="week">週</option>
            <option value="month">月</option>
            <option value="year">年</option>
          </select>
          <span id="cycleEvery" style="display:inline-flex;gap:6px;align-items:center">
            <input name="cycleN" type="number" min="1" step="1" value="1"><span id="cycleWords" class="muted">ごとに1回</span>
          </span>
        </span>
        <span class="hint" id="cyclePreview"></span>
      </label>
      <label class="inline full"><input type="checkbox" name="onList" checked>今すぐ購入リストに入れる</label>
    </div>
    <div class="actions">
      <button type="button" class="btn" data-close>キャンセル</button>
      <button class="btn primary" value="ok">保存</button>
    </div>
  </form>
</dialog>

<!-- 購入記録 -->
<dialog id="buyDlg">
  <form id="buyForm" method="dialog">
    <h2 id="buyDlgTitle">購入を記録</h2>
    <div class="form-grid">
      <label>購入日<input name="date" type="date" required></label>
      <label>購入場所<span class="combo" data-combo="place"><input name="place" required maxlength="40" autocomplete="off"><button type="button" class="combo-btn" tabindex="-1" aria-label="過去の入力から選ぶ">▼</button></span></label>
      <label>単価（円）<input name="unitPrice" type="number" min="0" step="any" required inputmode="decimal"></label>
      <label>数量<input name="qty" type="number" min="0.01" step="any" required inputmode="decimal"></label>
      <label class="inline full"><input type="checkbox" name="sale">セール品だった</label>
      <div class="full">
        <p class="hint" id="buyRef"></p>
        <p class="hint" id="buyCompare"></p>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn" data-close>キャンセル</button>
      <button class="btn primary" value="ok">記録する</button>
    </div>
  </form>
</dialog>

<!-- 履歴 -->
<!-- 品目リストから購入リストへ追加 -->
<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h2 id="addDlgTitle">購入リストに追加</h2>
    <p class="hint" id="addSrc" style="margin:0 0 10px"></p>
    <div class="form-grid">
      <label class="full">購入場所<span class="combo" data-combo="place"><input name="place" maxlength="40" autocomplete="off"><button type="button" class="combo-btn" tabindex="-1" aria-label="過去の入力から選ぶ">▼</button></span></label>
      <label>単価（円）<input name="unitPrice" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>数量<input name="qty" type="number" min="0" step="any" inputmode="decimal"></label>
      <div class="full"><button type="button" class="btn sm" id="addUseLow" hidden></button></div>
    </div>
    <div class="actions">
      <button type="button" class="btn" data-close>キャンセル</button>
      <button class="btn primary" value="ok">購入リストに追加</button>
    </div>
  </form>
</dialog>

<dialog id="histDlg">
  <div class="dlg">
    <h2 id="histTitle">購入履歴</h2>
    <div class="scroll" id="histBody"></div>
    <div class="actions">
      <button class="btn" id="histAdd">過去の購入を追加</button>
      <button class="btn primary" data-close>閉じる</button>
    </div>
  </div>
</dialog>

<script>
'use strict';
/* ========= 基本ユーティリティ ========= */
const KEY = 'supply-tracker-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmtNum = n => Number(n).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
const yen = n => (n == null ? '—' : '¥' + fmtNum(n));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const diffDays = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 864e5);
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const fmtDate = s => { if (!s) return '—'; const d = fromISO(s); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`; };

function addUnits(iso, n, unit) {
  const d = fromISO(iso);
  if (unit === 'day') d.setDate(d.getDate() + n);
  else if (unit === 'week') d.setDate(d.getDate() + 7 * n);
  else {
    const months = unit === 'month' ? n : 12 * n, day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + months);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  }
  return toISO(d);
}

/* ========= データ ========= */
const DEFAULT_CATS = ['食品', '飲料', '調味料', '日用品', '洗剤・衛生', 'ペット', 'その他'];
const DEFAULT_PLACES = ['コンビニ', 'スーパー', 'ドラッグストア', 'ホームセンター', 'ネット通販', 'ファミリーマート', 'セブン-イレブン', 'ローソン'];

const LS_DATA = 'supply-tracker-v2', LS_UI = 'supply-tracker-ui';
let state = { items: [], purchases: [] };           // items は購入履歴(purchases)を内側に持つ。state.purchases は集計用の平坦な写し
const ui = Object.assign({ tab: 'list', sortKey: 'category', sortDir: 1, group: 'none', period: 'month', anchor: today() }, (() => {
  try { return JSON.parse(localStorage.getItem(LS_UI)) || {}; } catch (e) { return {}; }
})());
function saveUi() { try { localStorage.setItem(LS_UI, JSON.stringify({ tab: ui.tab, sortKey: ui.sortKey, sortDir: ui.sortDir, group: ui.group, period: ui.period })); } catch (e) { /* 保存できなくても動作する */ } }

let db = null, downloads = null, loaded = false;
function rebuild() { state.purchases = state.items.flatMap(it => (it.purchases || []).map(p => ({ ...p, itemId: it.id }))); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3500);
}
function setSync(text, bad) { const el = $('#sync'); el.textContent = text; el.classList.toggle('bad', !!bad); }
function dbErr(e) { toast('保存できませんでした：' + ((e && e.message) || '編集権限がないか、接続できません')); }
function localSave() { try { localStorage.setItem(LS_DATA, JSON.stringify({ items: state.items })); } catch (e) { toast('この端末に保存できませんでした'); } }
const chains = {};
/** 変更した品目を保存する（同じドキュメントへの書き込みは1件ずつ順番に） */
function persist(id) {
  rebuild();
  if (!db) { localSave(); return; }
  const it = state.items.find(i => i.id === id); if (!it) return;
  const { id: _omit, ...body } = JSON.parse(JSON.stringify(it));
  chains[id] = (chains[id] || Promise.resolve()).then(() => db.collection('items').doc(id).set(body)).catch(dbErr);
}
function removeItem(id) {
  state.items = state.items.filter(i => i.id !== id); rebuild();
  if (!db) { localSave(); return; }
  chains[id] = (chains[id] || Promise.resolve()).then(() => db.collection('items').doc(id).delete()).catch(dbErr);
}
function askConfirm(msg, okLabel = 'OK') {
  return new Promise(res => {
    const d = $('#confirmDlg'); $('#confirmMsg').textContent = msg; $('#confirmYes').textContent = okLabel;
    const done = v => { d.close(); $('#confirmYes').onclick = $('#confirmNo').onclick = null; res(v); };
    $('#confirmYes').onclick = () => done(true); $('#confirmNo').onclick = () => done(false); d.oncancel = () => res(false);
    d.showModal();
  });
}

/* ========= 計算 ========= */
const UNIT_JA = { day: '日', week: '週間', month: 'ヶ月', year: '年' };
function cycleLabel(it) {
  if (!it.cycleUnit || it.cycleUnit === 'none') return '—';
  const n = it.cycleN || 1;
  if (n === 1) return { day: '毎日', week: '週1回', month: '月1回', year: '年1回' }[it.cycleUnit];
  return `${n}${UNIT_JA[it.cycleUnit]}に1回`;
}
function statsFor(item) {
  let last = null, low = null, count = 0;
  for (const p of item.purchases || []) {
    count++;
    if (!last || p.date >= last.date) last = p;
    if (!low || p.unitPrice < low.unitPrice || (p.unitPrice === low.unitPrice && p.date >= low.date)) low = p;
  }
  return { last, low, count };
}
function nextDue(item, st) {
  if (!item.cycleUnit || item.cycleUnit === 'none') return null;
  const base = [st.last && st.last.date, item.skipDate].filter(Boolean).sort().pop();
  return base ? addUnits(base, item.cycleN || 1, item.cycleUnit) : null;
}
function listRows() {
  const t = today(), rows = [];
  for (const item of state.items) {
    const st = statsFor(item), due = nextDue(item, st);
    const isDue = !!due && due <= t;
    if (!item.onList && !isDue) continue;
    rows.push({ item, st, due, isDue, auto: isDue && !item.onList, elapsed: st.last ? diffDays(st.last.date, t) : null });
  }
  return rows;
}

/* ========= 並べ替え ========= */
const SORTS = {
  name:     { label: '品名',           get: r => r.item.name },
  category: { label: 'カテゴリ',       get: r => r.item.category },
  place:    { label: '購入場所',       get: r => r.item.place },
  price:    { label: '単価',           get: r => r.item.unitPrice },

function cmpBy(key, dir) {
  const g = SORTS[key].get;
  return (a, b) => {
    const x = g(a), y = g(b), xe = x == null || x === '', ye = y == null || y === '';
    if (xe || ye) return xe && ye ? 0 : xe ? 1 : -1; // 空欄は常に最後

let cmpQ = '';
function compareHtml(q) {

  const items = state.items.filter(i => (i.purchases || []).length && (!q || i.name.toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q)))
    .sort((a, b) => (a.category || '').localeCompare(b.category || '', 'ja') || a.name.localeCompare(b.name, 'ja'));
  if (!items.length) return `<div class="card empty">${q ? '該当する品目がありません' : '購入履歴のある品目がありません。購入を記録すると、購入場所ごとの価格を比較できます。'}</div>`;
  return items.map(item => {
    const by = new Map();
    for (const p of item.purchases) {
      const g = by.get(p.place) || { place: p.place, n: 0, sale: 0, qty: 0, sum: 0, low: Infinity, last: null };
      g.n++; if (p.sale) g.sale++; g.qty += p.qty; g.sum += p.unitPrice * p.qty; g.low = Math.min(g.low, p.unitPrice);
      if (!g.last || p.date >= g.last.date) g.last = p;
      by.set(p.place, g);
    }
    const rows = [...by.values()].sort((a, b) => a.low - b.low || a.place.localeCompare(b.place, 'ja')), best = rows[0].low;
    const tr = rows.map((g, i) => {
      const diff = g.low - best, avg = g.qty ? g.sum / g.qty : 0;
      return `<tr class="${i === 0 ? 'best' : ''}"><td>${esc(g.place)}${i === 0 && rows.length > 1 ? '<span class="badge">最安</span>' : ''}</td>
        <td class="r">${g.n}</td><td class="r"><b>${yen(g.low)}</b></td>
        <td class="r ${diff > 0 ? 'warn' : 'muted'}">${diff > 0 ? `+${yen(diff)}（+${(diff / best * 100).toFixed(0)}%）` : '—'}</td>
        <td class="r">${yen(avg)}</td><td class="r">${yen(g.last.unitPrice)}${g.last.sale ? '<span class="sale">セール</span>' : ''}</td><td class="r">${g.sale ? `${g.sale}/${g.n}` : '—'}</td><td>${fmtDate(g.last.date)}</td></tr>`;
    }).join('');

  }).join('');
}

const PALETTE = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#64748b'];
function rangeOf(period, anchor) {
  const d = fromISO(anchor), y = d.getFullYear(), m = d.getMonth() + 1;
  if (period === 'day') return { s: anchor, e: anchor, label: `${y}年${m}月${d.getDate()}日（${WD[d.getDay()]}）` };
  if (period === 'week') {
    const s = addUnits(anchor, -((d.getDay() + 6) % 7), 'day'), e = addUnits(s, 6, 'day'), sd = fromISO(s), ed = fromISO(e);
    return { s, e, label: `${sd.getFullYear()}年${sd.getMonth() + 1}月${sd.getDate()}日〜${sd.getMonth() === ed.getMonth() ? '' : (ed.getMonth() + 1) + '月'}${ed.getDate()}日` };
  }
  if (period === 'month') return { s: `${y}-${pad(m)}-01`, e: toISO(new Date(y, m, 0)), label: `${y}年${m}月` };
  return { s: `${y}-01-01`, e: `${y}-12-31`, label: `${y}年` };
}
function pieSvg(slices, total) {
  const R = 90, C = 100;
  if (slices.length === 1) return `<svg viewBox="0 0 200 200" role="img" aria-label="カテゴリ別購入価格の円グラフ"><circle cx="${C}" cy="${C}" r="${R}" fill="${slices[0].color}"><title>${esc(slices[0].name)} ${yen(slices[0].value)}</title></circle></svg>`;
  let a0 = -Math.PI / 2;
  const paths = slices.map(s => {
    const a1 = a0 + (s.value / total) * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
    const p = `M${C},${C} L${C + R * Math.cos(a0)},${C + R * Math.sin(a0)} A${R},${R} 0 ${large} 1 ${C + R * Math.cos(a1)},${C + R * Math.sin(a1)} Z`;
    a0 = a1;
    return `<path d="${p}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.name)} ${yen(s.value)}（${(s.value / total * 100).toFixed(1)}%）</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 200 200" role="img" aria-label="カテゴリ別購入価格の円グラフ">${paths}</svg>`;
}
function renderStats() {
  const { s, e, label } = rangeOf(ui.period, ui.anchor);
  const ps = state.purchases.filter(p => p.date >= s && p.date <= e);
  const itemById = Object.fromEntries(state.items.map(i => [i.id, i]));

  const catSum = new Map(), itemAgg = new Map();
  for (const p of ps) {
    const it = itemById[p.itemId]; if (!it) continue;
    const cat = it.category || '未設定', amt = p.unitPrice * p.qty;

    const a = itemAgg.get(it.id) || { it, count: 0, qty: 0, sum: 0, places: new Set(), last: '' };
    a.count++; a.qty += p.qty; a.sum += amt; a.places.add(p.place); if (p.date > a.last) a.last = p.date;

  const slices = [...catSum].map(([name, value]) => ({ name, value, color: PALETTE[allCats.indexOf(name) % PALETTE.length] })).sort((a, b) => b.value - a.value);
  const pb = (k, l) => `<button data-period="${k}" aria-pressed="${ui.period === k}">${l}</button>`;
  const itemRows = [...itemAgg.values()].sort((a, b) => b.sum - a.sum).map(a => `<tr>
    <td class="name">${esc(a.it.name)}</td><td>${esc(a.it.category) || '—'}</td><td class="r">${a.count}</td><td class="r">${fmtNum(a.qty)}</td>
    <td class="r"><b>${yen(a.sum)}</b></td><td class="r">${yen(a.sum / a.qty)}</td><td>${esc([...a.places].join('、'))}</td><td>${fmtDate(a.last)}</td></tr>`).join('');
  app.innerHTML = `
    <div class="bar">
      <div class="period">${pb('day', '日')}${pb('week', '週')}${pb('month', '月')}${pb('year', '年')}</div>

      <button class="btn sm" data-nav="0">今日</button>
    </div>
    <div class="stats-grid">
      <section class="card pie-wrap">
        <div class="muted small">カテゴリ別 購入価格</div>
        <div class="total-big">${yen(total)}</div>
        ${slices.length ? pieSvg(slices, total) + `<div class="legend">${slices.map(sl => `<div><i style="background:${sl.color}"></i>${esc(sl.name)}<span class="v">${yen(sl.value)}（${(sl.value / total * 100).toFixed(1)}%）</span></div>`).join('')}</div>` : '<p class="muted">この期間の購入はありません</p>'}
      </section>
      <section class="card">
        <div class="scroll"><table>
          <thead><tr><th>品名</th><th>カテゴリ</th><th class="r">購入回数</th><th class="r">数量</th><th class="r">合計金額</th><th class="r">平均単価</th><th>購入場所</th><th>最終購入日</th></tr></thead>
          <tbody>${itemRows || `<tr><td colspan="8" class="empty">この期間の購入はありません</td></tr>`}</tbody></table></div>
      </section>

}


/* ========= 入力候補つきテキスト欄（手入力 + 過去の入力をプルダウン表示） ========= */

  const used = [...count].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja')).map(e => e[0]);

}

    const cur = ul.querySelector('.on'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  const mark = i => { idx = i; ul.querySelectorAll('li').forEach((li, k) => li.classList.toggle('on', k === i)); const el = ul.children[i]; if (el) el.scrollIntoView({ block: 'nearest' }); };
  btn.addEventListener('mousedown', e => e.preventDefault());           // 入力欄のフォーカスを保つ
  btn.addEventListener('click', () => { if (ul) close(); else { open(''); input.focus(); } });
  input.addEventListener('input', () => { if (document.activeElement === input && input.value.trim()) open(input.value); else close(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!ul) open(''); mark(Math.min(opts.length - 1, idx + 1)); }
    else if (e.key === 'ArrowUp' && ul) { e.preventDefault(); mark(Math.max(0, idx - 1)); }
    else if (e.key === 'Enter' && ul && idx >= 0) { e.preventDefault(); choose(opts[idx]); }
    else if (e.key === 'Escape' && ul) { e.preventDefault(); e.stopPropagation(); close(); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
  box.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); choose(opts[+li.dataset.i]); } });
}
document.querySelectorAll('[data-combo]').forEach(setupCombo);

/* ========= ダイアログ ========= */
const itemDlg = $('#itemDlg'), itemForm = $('#itemForm'), buyDlg = $('#buyDlg'), buyForm = $('#buyForm'), histDlg = $('#histDlg');
document.querySelectorAll('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
let editingId = null, buyCtx = null, histId = null;
const getItem = id => state.items.find(i => i.id === id);

function updateCycleUi() {
  const u = itemForm.cycleUnit.value, n = Math.max(1, parseInt(itemForm.cycleN.value) || 1);
  $('#cycleEvery').style.display = u === 'none' ? 'none' : 'inline-flex';
  $('#cycleWords').textContent = { day: '日ごとに1回', week: '週間ごとに1回', month: 'ヶ月ごとに1回', year: '年ごとに1回' }[u] || '';
  $('#cyclePreview').textContent = u === 'none' ? 'サイクルを設定すると、期日になったとき自動で購入リストに載ります' : `→ ${cycleLabel({ cycleUnit: u, cycleN: n })}（期日になると自動で購入リストに載ります）`;
}
itemForm.cycleUnit.addEventListener('change', updateCycleUi);
itemForm.cycleN.addEventListener('input', updateCycleUi);

function openItemDlg(id) {
  editingId = id;
  const it = id ? getItem(id) : { qty: 1, cycleUnit: 'none', cycleN: 1, onList: true };
  $('#itemDlgTitle').textContent = id ? '品目を編集' : '品目を追加';
  itemForm.name.value = it.name || ''; itemForm.category.value = it.category || ''; itemForm.place.value = it.place || '';
  itemForm.unitPrice.value = it.unitPrice ?? ''; itemForm.qty.value = it.qty ?? 1;
  itemForm.cycleUnit.value = it.cycleUnit || 'none'; itemForm.cycleN.value = it.cycleN || 1;
  itemForm.onList.checked = !!it.onList;
  updateCycleUi(); itemDlg.showModal();
}
itemForm.addEventListener('submit', ev => {
  if (ev.submitter && ev.submitter.value !== 'ok') return;
  const f = itemForm, num = v => (v === '' ? null : Math.max(0, parseFloat(v)));
  const data = {
    name: f.name.value.trim(), category: f.category.value.trim(), place: f.place.value.trim(),
    unitPrice: num(f.unitPrice.value), qty: num(f.qty.value) ?? 1,
    cycleUnit: f.cycleUnit.value, cycleN: Math.max(1, parseInt(f.cycleN.value) || 1), onList: f.onList.checked,
  };
  if (!data.name) return;
  let id = editingId;
  if (id) Object.assign(getItem(id), data);
  else { id = uid(); state.items.push({ id, skipDate: null, purchases: [], ...data }); }
  persist(id); render();
});

function openBuyDlg(id, mode) { // mode: 'list'(リストから購入) | 'direct' | 'past'
  const it = getItem(id), st = statsFor(it);
  buyCtx = { id, mode };
  $('#buyDlgTitle').textContent = `${mode === 'past' ? '過去の購入を追加' : '購入を記録'}：${it.name}`;
  buyForm.date.value = today(); buyForm.date.max = today();
  buyForm.place.value = it.place || (st.last && st.last.place) || '';
  buyForm.unitPrice.value = it.unitPrice ?? ''; buyForm.qty.value = it.qty ?? 1; buyForm.sale.checked = false;
  $('#buyRef').textContent = st.last ? `前回：${fmtDate(st.last.date)} ${st.last.place} ${yen(st.last.unitPrice)}` : '購入履歴はまだありません';
  updateBuyCompare(); buyDlg.showModal();
}
function updateBuyCompare() {
  const low = statsFor(getItem(buyCtx.id)).low, el = $('#buyCompare');
  const v = parseFloat(buyForm.unitPrice.value);
  el.className = 'hint';
  if (!low) { el.textContent = ''; return; }
  const base = `最安値：${yen(low.unitPrice)}（${low.place}・${fmtDate(low.date)}）`;
  if (isNaN(v)) el.textContent = base;
  else if (v < low.unitPrice) { el.textContent = `${base} → 最安値を更新します`; el.className = 'hint good'; }
  else if (v > low.unitPrice) el.textContent = `${base} → 最安値より ${fmtNum(v - low.unitPrice)}円 高い`;
  else el.textContent = `${base} → 最安値タイ`;
}
buyForm.unitPrice.addEventListener('input', updateBuyCompare);
buyForm.addEventListener('submit', ev => {
  if (ev.submitter && ev.submitter.value !== 'ok') return;
  const f = buyForm, sale = f.sale.checked, unitPrice = parseFloat(f.unitPrice.value), qty = parseFloat(f.qty.value), place = f.place.value.trim();
  if (!f.date.value || !place || isNaN(unitPrice) || isNaN(qty)) return;
  const it = getItem(buyCtx.id);
  (it.purchases = it.purchases || []).push({ id: uid(), date: f.date.value, place, unitPrice, qty, sale });
  if (buyCtx.mode !== 'past') { // 通常の購入：リストから外し、次回の初期値を今回の内容にする
    it.onList = false; it.unitPrice = unitPrice; it.qty = qty; it.place = place;
  }
  persist(it.id); render(); if (histDlg.open) renderHist();
});

function renderHist() {
  const it = getItem(histId); if (!it) { histDlg.close(); return; }
  const st = statsFor(it);
  $('#histTitle').textContent = `購入履歴：${it.name}`;
  const ps = [...(it.purchases || [])].sort((a, b) => b.date.localeCompare(a.date));
  $('#histBody').innerHTML = ps.length ? `<table><thead><tr><th>購入日</th><th>購入場所</th><th class="r">単価</th><th class="r">数量</th><th class="r">小計</th><th>セール</th><th></th></tr></thead><tbody>${
    ps.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.place)}</td><td class="r">${yen(p.unitPrice)}${st.low && st.low.id === p.id ? ' <span class="good" title="最安値">★</span>' : ''}</td>
      <td class="r">${fmtNum(p.qty)}</td><td class="r">${yen(p.unitPrice * p.qty)}</td>
      <td><input type="checkbox" data-sale="${p.id}" ${p.sale ? 'checked' : ''} aria-label="セール品"></td>
      <td><button class="btn sm danger" data-delp="${p.id}">削除</button></td></tr>`).join('')}</tbody></table>` : '<p class="empty">履歴はまだありません</p>';
}
$('#histBody').addEventListener('change', e => {
  const pid = e.target.dataset.sale; if (!pid) return;
  const it = getItem(histId), p = it.purchases.find(x => x.id === pid); if (!p) return;
  p.sale = e.target.checked; persist(it.id); render();
});
$('#histBody').addEventListener('click', async e => {
  const pid = e.target.dataset.delp; if (!pid) return;
  if (!(await askConfirm('この購入記録を削除しますか？', '削除'))) return;
  const it = getItem(histId); it.purchases = it.purchases.filter(p => p.id !== pid);
  persist(it.id); render(); renderHist();
});
$('#histAdd').addEventListener('click', () => openBuyDlg(histId, 'past'));

/* ===== 品目リスト → 購入リスト ===== */
const addDlg = $('#addDlg'), addForm = $('#addForm');
let addId = null, addLow = null;
function openAddDlg(id) {
  const it = getItem(id), pf = prefillFor(it);
  addId = id; addLow = pf.low;
  $('#addDlgTitle').textContent = `購入リストに追加：${it.name}`;
  $('#addSrc').textContent = pf.label;
  addForm.place.value = pf.place; addForm.unitPrice.value = pf.unitPrice ?? ''; addForm.qty.value = pf.qty ?? 1;
  const useLow = $('#addUseLow');
  useLow.hidden = !(pf.low && (pf.low.place !== pf.place || pf.low.unitPrice !== pf.unitPrice));
  if (!useLow.hidden) useLow.textContent = `最安値（${pf.low.place}・${yen(pf.low.unitPrice)}・${fmtDate(pf.low.date)}）に切り替える`;
  addDlg.showModal();
}
$('#addUseLow').addEventListener('click', () => { if (addLow) { addForm.place.value = addLow.place; addForm.unitPrice.value = addLow.unitPrice; } });
addForm.addEventListener('submit', ev => {
  if (ev.submitter && ev.submitter.value !== 'ok') return;
  const it = getItem(addId), price = parseFloat(addForm.unitPrice.value), qty = parseFloat(addForm.qty.value);
  it.place = addForm.place.value.trim(); it.unitPrice = isNaN(price) ? null : Math.max(0, price); it.qty = isNaN(qty) ? 1 : Math.max(0, qty);
  it.onList = true; it.skipDate = null;
  persist(addId); render(); toast(`「${it.name}」を購入リストに追加しました`);
});
function bulkAdd() {
  const ids = [...app.querySelectorAll('[data-pick]:checked')].map(c => c.dataset.pick);
  for (const id of ids) { const it = getItem(id), pf = prefillFor(it); Object.assign(it, { place: pf.place, unitPrice: pf.unitPrice, qty: pf.qty, onList: true, skipDate: null }); persist(id); }
  render(); toast(`${ids.length}品目を購入リストに追加しました（前回購入のデータで入力）`);
}

/* ========= イベント ========= */
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.dataset.tab; if (!t) return;
  ui.tab = t; saveUi(); render();
});
app.addEventListener('click', async e => {
  const th = e.target.closest('th[data-sort]');
  if (th) { const k = th.dataset.sort; if (ui.sortKey === k) ui.sortDir *= -1; else { ui.sortKey = k; ui.sortDir = 1; } saveUi(); return render(); }
  if (e.target.id === 'sortDir') { ui.sortDir *= -1; saveUi(); return render(); }
  const per = e.target.closest('[data-period]');
  if (per) { ui.period = per.dataset.period; saveUi(); return render(); }
  const nav = e.target.closest('[data-nav]');
  if (nav) { const n = +nav.dataset.nav; ui.anchor = n === 0 ? today() : addUnits(ui.anchor, n, ui.period); return render(); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, it = id && getItem(id);
  switch (b.dataset.act) {
    case 'new': openItemDlg(null); break;
    case 'sample': loadSample(); break;
    case 'edit': openItemDlg(id); break;
    case 'buy': openBuyDlg(id, b.dataset.mode || 'list'); break;
    case 'hist': histId = id; renderHist(); histDlg.showModal(); break;
    case 'addlist': openAddDlg(id); break;
    case 'bulkadd': bulkAdd(); break;
    case 'skip': it.onList = false; it.skipDate = today(); persist(id); render(); toast(`「${it.name}」を購入リストから削除しました（品目リストには残っています）`); break;
    case 'del':
      if (await askConfirm(`「${it.name}」と、その購入履歴をすべて削除しますか？`, '削除')) { removeItem(id); render(); }
      break;
  }
});
app.addEventListener('change', e => {
  if (e.target.id === 'sortKey') { ui.sortKey = e.target.value; saveUi(); return render(); }
  if (e.target.id === 'groupBy') { ui.group = e.target.value; saveUi(); return render(); }
  const f = e.target.dataset.field; if (!f) return;
  const it = getItem(e.target.dataset.id), v = parseFloat(e.target.value);
  if (isNaN(v) || v < 0) { e.target.value = it[f] ?? ''; return; }
  it[f] = v; persist(it.id);
  const low = statsFor(it).low;
  if (f === 'unitPrice') e.target.classList.toggle('pricey', !!low && v > low.unitPrice);
  const rows = listRows(); // 入力欄のフォーカスを保つため全体再描画はせず、合計だけ更新する
  $('#planTotal').textContent = yen(planTotal(rows)); $('#listTotals').innerHTML = totalsHtml(rows);
});

/* ========= 書き出し／読み込み ========= */
$('#exportBtn').addEventListener('click', async () => {
  const text = JSON.stringify({ version: 2, items: state.items }, null, 2), filename = `supply-${today()}.json`;
  try {
    if (downloads) await downloads.save({ filename, data: text });
    else { // Claude の外（ファイルを直接開いた場合）
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
    }
  } catch (err) { if (!err || err.code !== 'declined') toast('書き出せませんでした'); }
});
function normalizeImport(d) {
  if (!d || !Array.isArray(d.items)) throw new Error('形式が違います');
  const legacy = Array.isArray(d.purchases) ? d.purchases : [];
  return d.items.filter(i => i && i.name).map(i => ({
    id: String(i.id || uid()), name: String(i.name), category: i.category || '', place: i.place || '',
    unitPrice: i.unitPrice ?? null, qty: i.qty ?? 1, cycleUnit: i.cycleUnit || 'none', cycleN: i.cycleN || 1,
    onList: !!i.onList, skipDate: i.skipDate || null,
    purchases: [...(i.purchases || []), ...legacy.filter(p => p.itemId === i.id)].map(p => ({ id: String(p.id || uid()), date: p.date, place: p.place || '', unitPrice: +p.unitPrice, qty: +p.qty, sale: !!p.sale })),
  }));
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const items = normalizeImport(JSON.parse(await file.text()));
    if (!(await askConfirm(`現在のデータを、読み込んだ ${items.length} 品目で置き換えます。よろしいですか？`, '置き換える'))) return;
    [...state.items].forEach(i => removeItem(i.id));
    state.items = items; items.forEach(i => persist(i.id)); render(); toast('読み込みました');
  } catch (err) { toast('読み込めませんでした：' + err.message); }
});

/* ========= サンプルデータ ========= */
function loadSample() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const defs = [
    ['牛乳', '食品', ['スーパー', 'ファミリーマート'], 198, 1, 'week', 1],
    ['卵', '食品', ['スーパー', 'ドラッグストア'], 238, 1, 'week', 1],
    ['食パン', '食品', ['スーパー', 'セブン-イレブン'], 148, 1, 'week', 1],
    ['ミネラルウォーター', '飲料', ['ファミリーマート', 'スーパー', 'ドラッグストア'], 108, 6, 'week', 2],
    ['コーヒー豆', '飲料', ['スーパー', 'ネット通販'], 780, 1, 'month', 1],
    ['トイレットペーパー', '日用品', ['ドラッグストア', 'ホームセンター', 'ネット通販'], 498, 1, 'month', 1],
    ['ティッシュ', '日用品', ['ドラッグストア', 'スーパー'], 348, 1, 'month', 1],
    ['洗濯洗剤', '洗剤・衛生', ['ドラッグストア', 'スーパー'], 398, 1, 'month', 2],
    ['シャンプー', '洗剤・衛生', ['ドラッグストア', 'ネット通販'], 548, 1, 'month', 1],
    ['ゴミ袋', '日用品', ['ホームセンター', 'ドラッグストア'], 298, 1, 'month', 3],
  ];
  const days = { day: 1, week: 7, month: 30, year: 365 }, t = today();
  for (const [name, category, places, base, qty, unit, n] of defs) {
    const item = { id: uid(), name, category, place: places[0], unitPrice: base, qty, cycleUnit: unit, cycleN: n, onList: false, skipDate: null, purchases: [] };
    const step = days[unit] * n;
    let ago = Math.round(step * (0.5 + rnd() * 0.9));
    while (ago < 150) {
      item.purchases.push({ id: uid(), date: addUnits(t, -ago, 'day'), place: places[Math.floor(rnd() * places.length)], unitPrice: Math.round(base * (0.82 + rnd() * 0.36)), qty, sale: rnd() < 0.2 });
      ago += Math.max(1, Math.round(step * (0.85 + rnd() * 0.3)));
    }
    state.items.push(item); persist(item.id);
  }
  render();
}

/* ========= 起動 ========= */
function inlineEditing() { const a = document.activeElement; return !!(a && a.dataset && a.dataset.field); }
function applyItems(docs) {
  state.items = docs; rebuild(); loaded = true;
  if (!inlineEditing()) render();
  if (histDlg.open) renderHist();
}
async function start() {
  render();
  try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
  if (!downloads && window.claude) $('#exportBtn').hidden = true;
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { // Claude に保存できない（ファイルを直接開いた／未サインイン）場合はこの端末に保存
    try { const d = JSON.parse(localStorage.getItem(LS_DATA)); if (d && Array.isArray(d.items)) state.items = d.items; } catch (e) { /* 空で開始 */ }
    setSync('保存先：この端末のみ'); applyItems(state.items); return;
  }
  setSync('保存先：Claude');
  const timer = setTimeout(() => setSync('接続に時間がかかっています。表示が古い可能性があります', true), 10000);
  db.collection('items').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync('保存先：Claude'); }
    applyItems(snap.docs.map(d => ({ purchases: [], ...JSON.parse(JSON.stringify(d.data())), id: d.id })));
  }, err => { clearTimeout(timer); setSync('Claude に接続できません（' + ((err && err.code) || 'error') + '）', true); applyItems(state.items); });
}
start();
</script>
